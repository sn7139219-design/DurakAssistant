name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q DurakAssistant_Android_Project_v2.zip -d source

      - name: Build APK
        run: gradle -p source/DurakAssistant assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DurakAssistant-APK
          path: source/DurakAssistant/app/build/outputs/apk/debug/app-debug.apk
